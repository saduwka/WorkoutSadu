			);
			name = "Embed Watch App";
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Watch/WorkoutSaduWatch.app",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nWATCH_APP=\"\"\nfor CANDIDATE in \\\n  \"${TARGET_BUILD_DIR}/../${CONFIGURATION}-watchos/WorkoutSaduWatch.app\" \\\n  \"${BUILD_DIR}/Products/${CONFIGURATION}-watchos/WorkoutSaduWatch.app\" \\\n  \"${BUILT_PRODUCTS_DIR}/../${CONFIGURATION}-watchos/WorkoutSaduWatch.app\"; do\n  if [ -d \"${CANDIDATE}\" ]; then\n    WATCH_APP=\"${CANDIDATE}\"\n    break\n  fi\ndone\nif [ -z \"${WATCH_APP}\" ] || [ ! -d \"${WATCH_APP}\" ]; then\n  echo \"error: WorkoutSaduWatch.app not found for embedding\"\n  exit 1\nfi\nDEST_DIR=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Watch\"\nDEST_APP=\"${DEST_DIR}/WorkoutSaduWatch.app\"\nmkdir -p \"${DEST_DIR}\"\nrm -rf \"${DEST_APP}\"\nditto \"${WATCH_APP}\" \"${DEST_APP}\"\nif [ \"${CODE_SIGNING_ALLOWED}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n  ENTITLEMENTS=\"${SRCROOT}/WorkoutSaduWatch/WorkoutSaduWatch.entitlements\"\n  if [ -f \"${ENTITLEMENTS}\" ]; then\n    /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --entitlements \"${ENTITLEMENTS}\" --preserve-metadata=identifier,flags --timestamp=none \"${DEST_APP}\"\n  else\n    /usr/bin/codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --preserve-metadata=identifier,entitlements,flags --timestamp=none \"${DEST_APP}\"\n  fi\n  /usr/bin/codesign --verify --deep --strict --verbose=2 \"${DEST_APP}\"\nfi\necho \"Embedded Watch app at ${DEST_APP}\"\n";
		};
